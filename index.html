<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<meta name="theme-color" content="#111111">

<title>ارتباط مستقیم</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;

    font-family:
        Tahoma,
        Arial,
        "Segoe UI",
        sans-serif;

    background: #111;
}

body {
    color: #111;
    touch-action: manipulation;
}


/* =========================================================
   MAIN PAGE
========================================================= */

.page {

    position: relative;

    width: 100%;

    height: 100vh;
    height: 100svh;
    height: 100dvh;

    overflow: hidden;

    background-color: #111;

    background-image:
        var(--random-background);

    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
}


/* =========================================================
   MAIN INSTRUCTION
========================================================= */

.instruction {

    position: absolute;

    z-index: 20;

    top: 3.5%;

    left: 50%;

    transform: translateX(-50%);

    width: 98%;

    text-align: center;

    white-space: nowrap;

    color: #111;

    font-size:
        clamp(
            25px,
            6.8vw,
            37px
        );

    font-weight: 900;

    line-height: 1.2;

    letter-spacing: -0.7px;

    text-shadow:
        0 1px 0 rgba(255,255,255,0.95),
        0 2px 2px rgba(255,255,255,0.55),
        0 3px 7px rgba(0,0,0,0.18);

    pointer-events: none;
}


/* =========================================================
   CONTACT AREA
========================================================= */

.contact-area {

    position: absolute;

    z-index: 30;

    top: 9.5%;

    left: 0;

    width: 100%;

    display: flex;

    flex-direction: row;

    justify-content: flex-start;

    align-items: flex-start;

    direction: ltr;

    padding-left: 10.7%;

    padding-right: 10%;

    gap: 10vw;

    pointer-events: none;
}


/* =========================================================
   CONTACT BUTTON
========================================================= */

.contact-button {

    position: relative;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    width: 36.2vw;

    max-width: 170px;

    height: 68px;

    border-radius: 15px;

    border: 1px solid
        rgba(255,255,255,0.76);

    text-decoration: none;

    overflow: hidden;

    cursor: pointer;

    pointer-events: auto;

    user-select: none;
    -webkit-user-select: none;

    transform:
        translate3d(0,0,0);

    transition:
        transform 80ms ease,
        box-shadow 80ms ease,
        filter 80ms ease,
        background 120ms ease;

    backdrop-filter:
        blur(14px)
        saturate(150%);

    -webkit-backdrop-filter:
        blur(14px)
        saturate(150%);
}


/* =========================================================
   GLASS EFFECT
========================================================= */

.contact-button::before {

    content: "";

    position: absolute;

    inset: 1px;

    border-radius: 14px;

    pointer-events: none;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.52) 0%,
            rgba(255,255,255,0.18) 25%,
            rgba(255,255,255,0.035) 58%,
            rgba(0,0,0,0.16) 100%
        );
}


/* =========================================================
   GLASS HIGHLIGHT
========================================================= */

.contact-button::after {

    content: "";

    position: absolute;

    top: 0;

    left: 9%;

    width: 82%;

    height: 2px;

    border-radius: 100%;

    background:
        rgba(255,255,255,0.82);

    box-shadow:
        0 1px 5px
        rgba(255,255,255,0.42);

    pointer-events: none;
}


/* =========================================================
   MESSENGER BUTTON
========================================================= */

.messenger-button {

    box-shadow:

        0 14px 24px
        rgba(0,0,0,0.34),

        0 7px 10px
        rgba(0,0,0,0.23),

        inset 0 3px 3px
        rgba(255,255,255,0.58),

        inset 0 -7px 10px
        rgba(0,0,0,0.19);
}


/* =========================================================
   EITAA
========================================================= */

.messenger-eitaa {

    background:
        linear-gradient(
            145deg,
            rgba(255,171,75,0.97),
            rgba(245,130,32,0.98) 48%,
            rgba(211,91,9,0.99)
        );
}


/* =========================================================
   RUBIKA
========================================================= */

.messenger-rubika {

    background:
        linear-gradient(
            145deg,
            rgba(190,125,255,0.97),
            rgba(142,68,220,0.98) 48%,
            rgba(91,37,157,0.99)
        );
}


/* =========================================================
   TELEGRAM
========================================================= */

.messenger-telegram {

    background:
        linear-gradient(
            145deg,
            rgba(76,190,255,0.97),
            rgba(34,158,217,0.98) 48%,
            rgba(18,108,160,0.99)
        );
}


/* =========================================================
   BALE
========================================================= */

.messenger-bale {

    background:
        linear-gradient(
            145deg,
            rgba(48,181,111,0.97),
            rgba(20,139,78,0.98) 48%,
            rgba(10,94,52,0.99)
        );
}


/* =========================================================
   WHATSAPP
========================================================= */

.whatsapp {

    background:
        linear-gradient(
            145deg,
            rgba(52,232,124,0.95),
            rgba(37,211,102,0.97) 48%,
            rgba(18,166,82,0.98)
        );

    box-shadow:

        0 14px 24px
        rgba(0,0,0,0.34),

        0 7px 10px
        rgba(0,0,0,0.23),

        inset 0 3px 3px
        rgba(255,255,255,0.58),

        inset 0 -7px 10px
        rgba(0,0,0,0.19);
}


/* =========================================================
   BUTTON NAME
========================================================= */

.button-name {

    position: relative;

    z-index: 5;

    color: #fff;

    font-size:
        clamp(
            22px,
            5.9vw,
            30px
        );

    font-weight: 900;

    line-height: 1;

    text-shadow:

        0 2px 2px
        rgba(0,0,0,0.32),

        0 3px 6px
        rgba(0,0,0,0.24);

    margin-bottom: 4px;
}


/* =========================================================
   DIRECT CONTACT TEXT
========================================================= */

.direct-text {

    position: relative;

    z-index: 5;

    color: #fff;

    font-size:
        clamp(
            14px,
            3.6vw,
            18px
        );

    font-weight: 900;

    line-height: 1;

    text-shadow:

        0 1px 2px
        rgba(0,0,0,0.35);

    white-space: nowrap;
}


/* =========================================================
   PRESS EFFECT
========================================================= */

.contact-button:active {

    transform:
        translate3d(0,5px,0)
        scale(0.985);

    filter:
        brightness(0.92);

    box-shadow:

        0 4px 7px
        rgba(0,0,0,0.30),

        0 2px 3px
        rgba(0,0,0,0.18),

        inset 0 6px 10px
        rgba(0,0,0,0.24),

        inset 0 -1px 2px
        rgba(255,255,255,0.18);
}


/* =========================================================
   SMALL HEIGHT PHONES
========================================================= */

@media (max-height: 700px) {

    .instruction {
        top: 3%;
        font-size: 22px;
    }

    .contact-area {
        top: 9.5%;
    }

    .contact-button {
        height: 62px;
    }

    .button-name {
        font-size: 21px;
        margin-bottom: 3px;
    }

    .direct-text {
        font-size: 14px;
    }
}


/* =========================================================
   VERY NARROW PHONES
========================================================= */

@media (max-width: 340px) {

    .instruction {
        top: 3%;
        font-size: 20px;
        letter-spacing: -0.5px;
    }

    .contact-area {
        top: 9.5%;
        padding-left: 8%;
        padding-right: 12%;
        gap: 8vw;
    }

    .contact-button {
        width: 38vw;
        height: 62px;
    }

    .button-name {
        font-size: 20px;
    }

    .direct-text {
        font-size: 13px;
    }
}


/* =========================================================
   LANDSCAPE
========================================================= */

@media (orientation: landscape) {

    .instruction {
        top: 2.5%;
        font-size: 20px;
    }

    .contact-area {
        top: 8%;
    }

    .contact-button {
        height: 58px;
    }

    .button-name {
        font-size: 20px;
    }

    .direct-text {
        font-size: 12px;
    }

}

</style>

</head>

<body>

<main class="page">

    <div class="instruction">
        یکی را انتخاب کنید
    </div>


    <section
        class="contact-area"
        aria-label="انتخاب پیام‌رسان"
    >


        <!-- =================================================
             RANDOM MESSENGER BUTTON
        ================================================== -->

        <a
            id="messengerButton"
            class="contact-button messenger-button messenger-eitaa"
            href="javascript:void(0);"
            aria-label="پیام‌رسان"
        >

            <span
                id="messengerName"
                class="button-name"
            >
                ایتا
            </span>

            <span class="direct-text">
                ارتباط مستقیم
            </span>

        </a>


        <!-- =================================================
             WHATSAPP BUTTON - FIXED
        ================================================== -->

        <a
            id="whatsappButton"
            class="contact-button whatsapp"
            href="#"
            aria-label="واتساپ"
        >

            <span class="button-name">
                واتساپ
            </span>

            <span class="direct-text">
                ارتباط مستقیم
            </span>

        </a>


    </section>

</main>


<script>


/* =========================================================
   SMART RANDOM BACKGROUND SYSTEM
   پشتیبانی تا background20.png
========================================================= */


/*
   نکته مهم:

   لازم نیست همه این 20 فایل را داشته باشی.

   کد خودش وجود فایل‌ها را بررسی می‌کند.

   اگر فقط این‌ها باشند:

   background.png
   background2.png
   background3.png
   background7.png

   فقط همین 4 فایل وارد قرعه‌کشی می‌شوند.

   اگر بعداً background8.png اضافه کنی،
   بدون تغییر کد خودش وارد قرعه‌کشی می‌شود.
*/


const MAX_BACKGROUND_NUMBER = 20;


/*
   کلید ذخیره بک‌گراند انتخاب‌شده
*/

const BACKGROUND_STORAGE_KEY =
    "rosha_smart_background_v3";


/*
   ساخت فهرست فایل‌های احتمالی
*/

const POSSIBLE_BACKGROUNDS = [];


/*
   فایل اول:
   background.png
*/

POSSIBLE_BACKGROUNDS.push(
    "./background.png"
);


/*
   فایل‌های 2 تا 20:
   background2.png
   background3.png
   ...
   background20.png
*/

for (
    let i = 2;
    i <= MAX_BACKGROUND_NUMBER;
    i++
) {

    POSSIBLE_BACKGROUNDS.push(
        "./background" +
        i +
        ".png"
    );

}


/*
   بررسی می‌کنیم کدام فایل‌ها واقعاً وجود دارند.
*/

async function findAvailableBackgrounds() {

    const available = [];


    const checks =
        POSSIBLE_BACKGROUNDS.map(
            function(file) {

                return fetch(
                    file,
                    {
                        method: "HEAD",
                        cache: "no-store"
                    }
                )
                .then(
                    function(response) {

                        if (
                            response.ok
                        ) {

                            available.push(
                                file
                            );

                        }

                    }
                )
                .catch(
                    function() {

                        /*
                           فایل وجود ندارد.
                           کاری نمی‌کنیم.
                        */

                    }
                );

            }
        );


    await Promise.all(
        checks
    );


    return available;

}


/*
   اعمال بک‌گراند
*/

function applyBackground(
    background
) {

    const page =
        document.querySelector(
            ".page"
        );


    page.style.setProperty(
        "--random-background",
        "url('" +
        background +
        "')"
    );

}


/*
   سیستم انتخاب بک‌گراند
*/

async function initializeBackground() {

    const availableBackgrounds =
        await findAvailableBackgrounds();


    /*
       اگر هیچ بک‌گراندی پیدا نشد،
       صفحه مشکی باقی می‌ماند.
    */

    if (
        availableBackgrounds.length === 0
    ) {

        return;

    }


    /*
       بررسی انتخاب قبلی
    */

    let selectedBackground =
        localStorage.getItem(
            BACKGROUND_STORAGE_KEY
        );


    /*
       اگر انتخاب قبلی هنوز وجود دارد،
       همان را نگه می‌داریم.
    */

    if (
        selectedBackground &&
        availableBackgrounds.includes(
            selectedBackground
        )
    ) {

        applyBackground(
            selectedBackground
        );

        return;

    }


    /*
       اگر انتخاب قبلی وجود ندارد
       یا فایلش دیگر موجود نیست،
       یک فایل واقعی را تصادفی انتخاب می‌کنیم.
    */

    const randomIndex =
        Math.floor(
            Math.random() *
            availableBackgrounds.length
        );


    selectedBackground =
        availableBackgrounds[
            randomIndex
        ];


    /*
       ذخیره انتخاب
    */

    localStorage.setItem(
        BACKGROUND_STORAGE_KEY,
        selectedBackground
    );


    /*
       اعمال بک‌گراند
    */

    applyBackground(
        selectedBackground
    );

}


/*
   اجرای سیستم بک‌گراند
*/

initializeBackground();


/* =========================================================
   RANDOM MESSENGER SYSTEM
========================================================= */

const MESSENGERS = [

    {
        id: "eitaa",
        name: "ایتا",
        className: "messenger-eitaa"
    },

    {
        id: "rubika",
        name: "روبیکا",
        className: "messenger-rubika"
    },

    {
        id: "telegram",
        name: "تلگرام",
        className: "messenger-telegram"
    },

    {
        id: "bale",
        name: "بله",
        className: "messenger-bale"
    }

];


/*
   کلید ذخیره وضعیت دکمه
*/

const MESSENGER_STORAGE_KEY =
    "rosha_selected_messenger_v3";


/*
   گرفتن دکمه و نوشته
*/

const messengerButton =
    document.getElementById(
        "messengerButton"
    );


const messengerName =
    document.getElementById(
        "messengerName"
    );


/*
   پیدا کردن پیام‌رسان
*/

function getMessengerById(id) {

    return MESSENGERS.find(
        function(messenger) {

            return messenger.id === id;

        }
    );

}


/*
   انتخاب اولیه
*/

let selectedMessengerId =
    localStorage.getItem(
        MESSENGER_STORAGE_KEY
    );


/*
   اگر انتخاب قبلی معتبر نیست،
   یک گزینه تصادفی انتخاب می‌شود.
*/

if (
    !getMessengerById(
        selectedMessengerId
    )
) {

    const randomIndex =
        Math.floor(
            Math.random() *
            MESSENGERS.length
        );


    selectedMessengerId =
        MESSENGERS[
            randomIndex
        ].id;


    localStorage.setItem(
        MESSENGER_STORAGE_KEY,
        selectedMessengerId
    );

}


/*
   اعمال ظاهر پیام‌رسان
*/

function applyMessenger(
    messenger
) {

    if (!messenger) {
        return;
    }


    messengerButton.classList.remove(
        "messenger-eitaa",
        "messenger-rubika",
        "messenger-telegram",
        "messenger-bale"
    );


    messengerButton.classList.add(
        messenger.className
    );


    messengerName.textContent =
        messenger.name;


    localStorage.setItem(
        MESSENGER_STORAGE_KEY,
        messenger.id
    );

}


/*
   اعمال وضعیت اولیه
*/

applyMessenger(
    getMessengerById(
        selectedMessengerId
    )
);


/* =========================================================
   WARNING SOUND
========================================================= */

let warningAudioContext = null;


function getWarningAudioContext() {

    try {

        if (!warningAudioContext) {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;


            if (!AudioContext) {
                return null;
            }


            warningAudioContext =
                new AudioContext();

        }


        if (
            warningAudioContext.state ===
            "suspended"
        ) {

            warningAudioContext.resume();

        }


        return warningAudioContext;

    } catch (error) {

        return null;

    }

}


/*
   صدای کوتاه اخطار
*/

function playWarningSound() {

    const ctx =
        getWarningAudioContext();


    if (!ctx) {
        return;
    }


    const now =
        ctx.currentTime;


    const oscillator =
        ctx.createOscillator();


    const gain =
        ctx.createGain();


    oscillator.type =
        "square";


    oscillator.frequency.setValueAtTime(
        430,
        now
    );


    oscillator.frequency.setValueAtTime(
        330,
        now + 0.055
    );


    gain.gain.setValueAtTime(
        0.0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        0.075,
        now + 0.006
    );


    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.13
    );


    oscillator.connect(
        gain
    );


    gain.connect(
        ctx.destination
    );


    oscillator.start(
        now
    );


    oscillator.stop(
        now + 0.135
    );

}


/* =========================================================
   تغییر پیام‌رسان با هر کلیک
========================================================= */

function changeMessengerRandomly() {

    const currentId =
        selectedMessengerId;


    const availableMessengers =
        MESSENGERS.filter(
            function(messenger) {

                return messenger.id !==
                    currentId;

            }
        );


    const randomIndex =
        Math.floor(
            Math.random() *
            availableMessengers.length
        );


    const nextMessenger =
        availableMessengers[
            randomIndex
        ];


    selectedMessengerId =
        nextMessenger.id;


    applyMessenger(
        nextMessenger
    );

}


/* =========================================================
   CLICK روی دکمه پیام‌رسان
========================================================= */

messengerButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();


        /*
           صدای اخطار
        */

        playWarningSound();


        /*
           تغییر تصادفی نام و رنگ
        */

        changeMessengerRandomly();

    }
);


/* =========================================================
   WHATSAPP SETTINGS
========================================================= */

const CONTACT_SETTINGS = {

    whatsappNumber:
        "989303833007",

    whatsappMessage:
        "سلام،\nمن از اینستاگرام برای صدور شناسنامه پیام دادم.لطفا راهنمایی بفرمایید"

};


/* =========================================================
   WHATSAPP
========================================================= */

const whatsappButton =
    document.getElementById(
        "whatsappButton"
    );


whatsappButton.href =
    "https://wa.me/" +
    CONTACT_SETTINGS.whatsappNumber +
    "?text=" +
    encodeURIComponent(
        CONTACT_SETTINGS.whatsappMessage
    );


/* =========================================================
   WHATSAPP BEEP
========================================================= */

let whatsappAudioContext = null;


function getWhatsappAudioContext() {

    try {

        if (!whatsappAudioContext) {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;


            if (!AudioContext) {
                return null;
            }


            whatsappAudioContext =
                new AudioContext();

        }


        if (
            whatsappAudioContext.state ===
            "suspended"
        ) {

            whatsappAudioContext.resume();

        }


        return whatsappAudioContext;

    } catch (error) {

        return null;

    }

}


function playWhatsappBeep() {

    const ctx =
        getWhatsappAudioContext();


    if (!ctx) {
        return;
    }


    const now =
        ctx.currentTime;


    const oscillator =
        ctx.createOscillator();


    const gain =
        ctx.createGain();


    oscillator.type =
        "sine";


    oscillator.frequency.setValueAtTime(
        880,
        now
    );


    gain.gain.setValueAtTime(
        0.0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        0.11,
        now + 0.006
    );


    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.105
    );


    oscillator.connect(
        gain
    );


    gain.connect(
        ctx.destination
    );


    oscillator.start(
        now
    );


    oscillator.stop(
        now + 0.11
    );

}


/* =========================================================
   TOUCH SOUND - WHATSAPP
========================================================= */

whatsappButton.addEventListener(
    "pointerdown",
    playWhatsappBeep,
    {
        passive: true
    }
);


/* =========================================================
   REFRESH WITHOUT SCROLL
========================================================= */

let touchStartY = 0;

let touchStartX = 0;

let refreshing = false;


document.addEventListener(
    "touchstart",
    function(event) {

        if (
            event.touches &&
            event.touches.length === 1
        ) {

            touchStartY =
                event.touches[0].clientY;


            touchStartX =
                event.touches[0].clientX;

        }

    },
    {
        passive: true
    }
);


document.addEventListener(
    "touchend",
    function(event) {

        if (refreshing) {
            return;
        }


        if (
            !event.changedTouches ||
            event.changedTouches.length !== 1
        ) {

            return;

        }


        const endY =
            event.changedTouches[0].clientY;


        const endX =
            event.changedTouches[0].clientX;


        const distanceY =
            endY - touchStartY;


        const distanceX =
            Math.abs(
                endX - touchStartX
            );


        if (
            touchStartY < 90 &&
            distanceY > 95 &&
            distanceY >
            distanceX * 1.4
        ) {

            refreshing = true;

            window.location.reload();

        }

    },
    {
        passive: true
    }
);


</script>

</body>

  </html>
